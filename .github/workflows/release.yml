name: release

# Метка vX.Y.Z → релиз на GitHub с готовыми ZIP для Windows (панель + портативный Python).
# Вручную (workflow_dispatch) — только собрать ZIP и приложить к запуску как артефакт.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-zip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Компилятор микрофонной библиотеки
        run: |
          sh .github/setup-zig.sh "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Метка совпадает с VERSION
        if: github.ref_type == 'tag'
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" || { echo "метка $GITHUB_REF_NAME, а в VERSION $(cat VERSION)"; exit 1; }
      - name: Сборка
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VER="dev-${GITHUB_SHA::7}"
          .github/build-windows-zip.sh "$VER" amd64 dist
          .github/build-windows-zip.sh "$VER" arm64 dist
          # программа помощника для колонки: панель без Go скачивает её с релиза и сверяет SHA256SUMS
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go -C device/assistant build -trimpath \
            -ldflags "-s -w -X main.version=$VER" -o "$PWD/dist/assistantd-linux-arm64" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go -C device/agent build -trimpath \
            -ldflags "-s -w -X main.version=$VER" -o "$PWD/dist/yapanel-agent-linux-arm64" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go -C device/viz build -trimpath \
            -ldflags "-s -w -X main.version=$VER" -o "$PWD/dist/vizd-linux-arm64" .
          cp device/mic-tap/build/mic-tap.so dist/mic-tap-linux-armhf.so
          (cd dist && sha256sum assistantd-linux-arm64 yapanel-agent-linux-arm64 vizd-linux-arm64 mic-tap-linux-armhf.so > SHA256SUMS)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            curl -fSL --retry 3 "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.zip" -o "dist/${GITHUB_REPOSITORY##*/}-${VER}.zip"
            (cd dist && sha256sum "${GITHUB_REPOSITORY##*/}-${VER}.zip" >> SHA256SUMS)
          fi
          (cd dist && sha256sum *.zip assistantd-linux-arm64 yapanel-agent-linux-arm64 vizd-linux-arm64 mic-tap-linux-armhf.so > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
      - name: Релиз
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "${GITHUB_REF_NAME} — Linux, плеер и автозапуск" --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
