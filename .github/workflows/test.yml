name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.9', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-local.txt
      - run: python -m compileall -q server.py model_colors.py zvuk.py zvuk_queries.py zvuk_player.py profiles.py midi.py managed_yam.py multi.py tools/midi_readonly.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: device/**/go.sum
      - name: Station shell test tools on macOS
        if: runner.os == 'macOS'
        run: |
          brew install flock gnu-sed
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s tests -v
      - run: python server.py --help
      - run: python multi.py --help
      - run: |
          sh -n start.sh
          sh -n start.command
          sh -n device/mic-tap/manage.sh
          sh -n device/mic-tap/build.sh
          sh -n .github/setup-zig.sh
      - name: JavaScript regressions
        run: |
          set -e
          for test in tests/*.cjs tests/*.mjs; do
            case "$test" in *test_model_color_browser*) continue;; esac
            node "$test"
          done
      - name: Device daemons
        if: runner.os == 'Linux'
        run: |
          go -C device/assistant test ./...
          go -C device/agent test ./...
          go -C device/viz test ./...

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-local.txt
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_model_color_browser.cjs

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-local.txt
      - run: python -m compileall -q .
      - run: python server.py --help
      - run: python multi.py --help
