name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ['3.9', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-local.txt
      - run: python -m compileall -q server.py model_colors.py zvuk.py zvuk_queries.py zvuk_player.py profiles.py midi.py managed_yam.py multi.py tools/midi_readonly.py
      - run: python -m unittest discover -s tests -v
      - run: python server.py --help
      - run: python multi.py --help
      - run: |
          sh -n start.sh
          sh -n start.command
          sh -n device/mic-tap/manage.sh
          sh -n device/mic-tap/build.sh
          sh -n .github/setup-zig.sh
      - run: node tests/test_renderer.mjs
      - run: node tests/test_paths.mjs
      - run: node tests/test_catalog.cjs
      - run: node tests/test_update_ui.cjs
